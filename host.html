<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>PG CLOUD GAMING - Host</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 500px;
            padding: 40px;
            background: #090909;
            border: 1px solid #e00000;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255,0,0,.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        h1 span {
            color: #e00000;
        }

        p {
            color: #777;
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #e00000;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,.4);
        }

        #status {
            margin-top: 20px;
            color: #00e676;
            font-size: 13px;
        }

        video {
            width: 100%;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }

    </style>

</head>


<body>

    <div class="box">

        <h1>
            PG <span>CLOUD GAMING</span>
        </h1>

        <p>
            CLOUD GAME HOST
        </p>

        <button onclick="startHost()">
            🎮 START GAME STREAM
        </button>

        <div id="status">
            Waiting for cloud player...
        </div>

        <video
            id="preview"
            autoplay
            muted>
        </video>

    </div>


    <script src="host.js"></script>

</body>

</html>
